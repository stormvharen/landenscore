name: LandenScore
version: '${project.version}'
main: nl.landen.LandenScore
api-version: '1.21'
softdepend: [Vault, Essentials, LuckPerms, PlaceholderAPI, TAB, Multiverse-Core, CrazyCrates, PhoenixCrates]
commands:
  land:
    description: Landen beheren
    aliases: [landen, country]
  sb:
    description: Scoreboard aan/uit
    aliases: [scoreboard]
  lobby:
    description: Naar de lobby
    aliases: [hub]
  setlobby:
    description: Zet een lobby op jouw plek (/setlobby [naam])
  afk:
    description: Ga naar de AFK-zone
  setafk:
    description: Zet de AFK-zone op jouw plek
  menu:
    description: Open het spelmenu
    aliases: [spelmodi, games]
  queue:
    description: Wachtrij voor PvP en Tower Drop
  arena:
    description: Arena's beheren
  npc:
    description: NPC's beheren
  beheer:
    description: Open het beheermenu (owner/admin)
    aliases: [owner, adminmenu]
  beloningen:
    description: Open het beloningenmenu
    aliases: [rewards, beloning]
  setbeloningen:
    description: Beloningen instellen (admin)
    aliases: [setrewards]
  keyall:
    description: Toon de keyall-timer (/keyall now = starten, admin)
  shards:
    description: Jouw diamanten (admin - /shards give|take|set <speler> <aantal>)
    aliases: [diamanten]
  store:
    description: Open de webshop
    aliases: [webshop, donate]
  buyalert:
    description: Meld een webshop-aankoop aan iedereen (console/admin)
  toplijst:
    description: Toplijst van kills, deaths of diamanten
    aliases: [lb, leaderboard]
  rtp:
    description: Willekeurig teleporteren
    aliases: [randomtp, wild]
  winkel:
    description: Open de winkel (geld, diamanten of shards)
    aliases: [shop, itemshop]
  setwinkel:
    description: Winkelitems beheren (admin)
  geld:
    description: Bekijk je saldo (/geld [speler])
    aliases: [saldo]
  betaal:
    description: Betaal een speler (/betaal <speler> <bedrag>)
  geldtop:
    description: De rijkste spelers
  geldbeheer:
    description: Geld geven/afpakken/instellen (admin/console)
  bank:
    description: Open het economie-menu
  dagelijks:
    description: Claim je dagelijkse beloning
    aliases: [daily]
permissions:
  landen.admin:
    default: op
  landen.build:
    description: Bouwen/slopen in de lobby
    default: op
